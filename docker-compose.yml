services:
  db:
    image: postgres:15-alpine
    container_name: gridy_db
    restart: always
    environment:
      POSTGRES_DB: gridy_db
      POSTGRES_USER: gridy_user
      POSTGRES_PASSWORD: gridy_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: gridy_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://gridy_user:gridy_password@db:5432/gridy_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: gridy_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: