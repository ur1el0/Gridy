name: Gridy CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gridy_db
          POSTGRES_USER: gridy_user
          POSTGRES_PASSWORD: gridy_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Manually install pytest since it's missing from requirements
          pip install pytest pytest-django pytest-cov

      - name: Run Django Pytest
        env:
          SECRET_KEY: "ci-dummy-key"
          DEBUG: "True"
          ADMIN_REGISTRATION_PASSKEY: "ci-only-test-value-not-for-deployment"
          DATABASE_URL: "postgres://gridy_user:gridy_password@localhost:5432/gridy_db"
          GRIDY_TEST_USE_SQLITE: "False"
        run: |
          cd backend
          DJANGO_SETTINGS_MODULE=config.settings python -c "import django; django.setup(); from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor"
          python -m pytest --cov=. --cov-fail-under=75

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        run: |
          cd frontend
          npx vitest run

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Analyze Dart Code
        run: |
          cd mobile
          flutter analyze

      - name: Run Widget & Unit Tests
        run: |
          cd mobile
          flutter test
