        Serves media files securely with directory-aware access control.
        Ensures that sensitive government IDs and resident billings are strictly
        protected under RA 10173 while public assets (logos, announcements) remain accessible.
      parameters:
      - in: path
        name: path
        schema:
          type: string
          pattern: ^.*$
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    ActivitySchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        event_datetime:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by
      - description
      - event_datetime
      - id
      - location
      - title
      - updated_at
    AdminNotification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          description: The specific admin receiving the alert
      required:
      - created_at
      - id
      - message
      - title
      - user
    AgeDemographics:
      type: object
      properties:
        youth:
          type: integer
        young_adult:
          type: integer
        adult:
          type: integer
        senior:
          type: integer
      required:
      - adult
      - senior
      - young_adult
      - youth
    AidRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        assistance_type:
          type: string
          maxLength: 100
        reason:
          type: string
          maxLength: 2000
        status:
          allOf:
          - $ref: '#/components/schemas/StatusB97Enum'
          readOnly: true
        staff_notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assistance_type
      - created_at
