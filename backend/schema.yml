components:
  schemas:
    ActivitySchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        event_datetime:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by
      - description
      - event_datetime
      - id
      - location
      - title
      - updated_at
    AdminRegister:
      type: object
      properties:
        full_name:
          type: string
          writeOnly: true
          maxLength: 255
        barangay_id:
          type: integer
          writeOnly: true
          nullable: true
        email:
          type: string
          format: email
          writeOnly: true
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
        affirmation:
          type: boolean
          writeOnly: true
          default: false
      required:
      - confirm_password
      - email
      - full_name
      - password
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        is_pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
      required:
      - content
      - created_at
      - created_by
      - id
      - title
      - updated_at
    Barangay:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        logo:
          type: string
          format: uri
          nullable: true
        city_seal:
          type: string
          format: uri
          nullable: true
        captain_name:
          type: string
          nullable: true
          description: Full name of the incumbent Punong Barangay
          maxLength: 255
        office_contact:
          type: string
          nullable: true
          description: Office Address or Phone Number
          maxLength: 255
      required:
      - id
      - name
    CategoryEnum:
      enum:
      - PEACE_AND_ORDER
      - PUBLIC_HEALTH
      - INFRASTRUCTURE
      - ENVIRONMENT
      - OTHER
      type: string
      description: |-
        * `PEACE_AND_ORDER` - Peace & Order (Riots, Noise, Curfew)
        * `PUBLIC_HEALTH` - Public Health (Vaccinations, Medical)
        * `INFRASTRUCTURE` - Infrastructure (Potholes, Outages)
        * `ENVIRONMENT` - Environment (Floods, Waste)
        * `OTHER` - Other
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    DashboardSummary:
      type: object
      properties:
        total_residents:
          type: integer
          default: 0
        document_requests:
          $ref: '#/components/schemas/DocumentStats'
        issue_reports:
          $ref: '#/components/schemas/IssueStats'
        queue_activity:
          $ref: '#/components/schemas/QueueActivity'
      required:
      - document_requests
      - issue_reports
      - queue_activity
    DocumentRequest:
      type: object
      properties:
        request_id:
          type: integer
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        document_type:
          type: string
          maxLength: 100
        urgency_tag:
          $ref: '#/components/schemas/UrgencyTagEnum'
        status:
          $ref: '#/components/schemas/DocumentRequestStatusEnum'
        admin_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - document_type
      - request_id
      - requester_name
      - updated_at
    DocumentRequestStatusEnum:
      enum:
      - PENDING
      - PROCESSING
      - READY_FOR_PICKUP
      - REJECTED
      - RELEASED
      type: string
      description: |-
        * `PENDING` - Pending
        * `PROCESSING` - Processing
        * `READY_FOR_PICKUP` - Ready for Pickup
        * `REJECTED` - Rejected
        * `RELEASED` - Released
    DocumentStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        released:
          type: integer
      required:
      - approved
      - pending
      - rejected
      - released
      - total
    FCMDevice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - token
    FileUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
          description: CSV file containing resident accounts to import.
      required:
      - file
    IssueReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        location:
          type: string
          description: A brief description of where the issue is located.
          maxLength: 255
        image:
          type: string
          format: uri
          nullable: true
        status:
          $ref: '#/components/schemas/IssueReportStatusEnum'
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        category:
          $ref: '#/components/schemas/CategoryEnum'
        incident_datetime:
          type: string
          format: date-time
          nullable: true
          description: Exact time the scenario occurred.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reporter:
          type: integer
          readOnly: true
      required:
      - created_at
      - description
      - id
      - location
      - reporter
      - title
      - updated_at
    IssueReportStatusEnum:
      enum:
      - PENDING
      - IN_PROGRESS
      - RESOLVED
      type: string
      description: |-
        * `PENDING` - Pending
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
    IssueStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        in_progress:
          type: integer
        resolved:
          type: integer
        urgency_breakdown:
          $ref: '#/components/schemas/UrgencyBreakdown'
      required:
      - in_progress
      - pending
      - resolved
      - total
      - urgency_breakdown
    PaginatedActivityScheduleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
