components:
  schemas:
    ActivitySchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        event_datetime:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by
      - description
      - event_datetime
      - id
      - location
      - title
      - updated_at
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        is_pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
      required:
      - content
      - created_at
      - created_by
      - id
      - title
      - updated_at
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    DashboardSummary:
      type: object
      properties:
        document_requests:
          $ref: '#/components/schemas/DocumentStats'
        issue_reports:
          $ref: '#/components/schemas/IssueStats'
        queue_activity:
          $ref: '#/components/schemas/QueueActivity'
      required:
      - document_requests
      - issue_reports
      - queue_activity
    DocumentRequest:
      type: object
      properties:
        request_id:
          type: integer
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        document_type:
          type: string
          maxLength: 100
        urgency_tag:
          $ref: '#/components/schemas/UrgencyTagEnum'
        status:
          $ref: '#/components/schemas/DocumentRequestStatusEnum'
        admin_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - document_type
      - request_id
      - requester_name
      - updated_at
    DocumentRequestStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - RELEASED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `RELEASED` - Released
    DocumentStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        released:
          type: integer
      required:
      - approved
      - pending
      - rejected
      - released
      - total
    FCMDevice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - token
    FileUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
          description: CSV file containing resident accounts to import.
      required:
      - file
    IssueReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        location:
          type: string
          description: A brief description of where the issue is located.
          maxLength: 255
        image:
          type: string
          format: uri
          nullable: true
        status:
          $ref: '#/components/schemas/IssueReportStatusEnum'
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reporter:
          type: integer
          readOnly: true
      required:
      - created_at
      - description
      - id
      - location
      - reporter
      - title
      - updated_at
    IssueReportStatusEnum:
      enum:
      - PENDING
      - IN_PROGRESS
      - RESOLVED
      type: string
      description: |-
        * `PENDING` - Pending
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
    IssueStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        in_progress:
          type: integer
        resolved:
          type: integer
        urgency_breakdown:
          $ref: '#/components/schemas/UrgencyBreakdown'
      required:
      - in_progress
      - pending
      - resolved
      - total
      - urgency_breakdown
    PatchedActivitySchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        event_datetime:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
    PatchedAnnouncement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        is_pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
    PatchedDocumentRequest:
      type: object
      properties:
        request_id:
          type: integer
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        document_type:
          type: string
          maxLength: 100
        urgency_tag:
          $ref: '#/components/schemas/UrgencyTagEnum'
        status:
          $ref: '#/components/schemas/DocumentRequestStatusEnum'
        admin_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedFCMDevice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedIssueReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        location:
          type: string
          description: A brief description of where the issue is located.
          maxLength: 255
        image:
          type: string
          format: uri
          nullable: true
        status:
          $ref: '#/components/schemas/IssueReportStatusEnum'
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reporter:
          type: integer
          readOnly: true
    PatchedQueueTicket:
      type: object
      properties:
        ticket_id:
          type: integer
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        service_type:
          type: string
          maxLength: 100
        status:
          allOf:
          - $ref: '#/components/schemas/QueueTicketStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    QueueActivity:
      type: object
      properties:
        total_today:
          type: integer
        serving_now:
          type: string
          nullable: true
        waiting_count:
          type: integer
      required:
      - serving_now
      - total_today
      - waiting_count
    QueueTicket:
      type: object
      properties:
        ticket_id:
          type: integer
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        service_type:
          type: string
          maxLength: 100
        status:
          allOf:
          - $ref: '#/components/schemas/QueueTicketStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - service_type
      - status
      - ticket_id
      - ticket_number
      - updated_at
    QueueTicketStatusEnum:
      enum:
      - WAITING
      - SERVING
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `WAITING` - Waiting
        * `SERVING` - Serving
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
        full_name:
          type: string
          writeOnly: true
        birth_date:
          type: string
          format: date
          writeOnly: true
        voter_status:
          type: boolean
          writeOnly: true
          default: false
        contact_number:
          type: string
          writeOnly: true
      required:
      - birth_date
      - full_name
      - password
      - username
    Resident:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 255
        birth_date:
          type: string
          format: date
        voter_status:
          type: boolean
        contact_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - birth_date
      - full_name
    ResidentImportResponse:
      type: object
      properties:
        imported:
          type: integer
          description: Number of residents successfully imported.
        skipped_due_to_duplicate:
          type: integer
          description: Number of records skipped due to pre-existing username.
        errors:
          type: array
          items:
            type: string
          description: List of validation error messages.
      required:
      - errors
      - imported
      - skipped_due_to_duplicate
    RoleEnum:
      enum:
      - ADMIN
      - RESIDENT
      type: string
      description: |-
        * `ADMIN` - Admin
        * `RESIDENT` - Resident
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UrgencyBreakdown:
      type: object
      properties:
        low:
          type: integer
        medium:
          type: integer
        high:
          type: integer
        urgent:
          type: integer
      required:
      - high
      - low
      - medium
      - urgent
    UrgencyEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - URGENT
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `URGENT` - Urgent
    UrgencyTagEnum:
      enum:
      - REGULAR
      - URGENT
      type: string
      description: |-
        * `REGULAR` - Regular
        * `URGENT` - Urgent
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        profile:
          allOf:
          - $ref: '#/components/schemas/Resident'
          readOnly: true
      required:
      - id
      - profile
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
